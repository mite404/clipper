<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171819" />
    <!-- CLIP-49: fetches reach only this origin, local blobs, OpenRouter and a local Ollama, so a
         key typed into the Assistant cannot be sent anywhere else. Workers and scripts are unchanged. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' blob: data: https://openrouter.ai http://localhost:11434 http://127.0.0.1:11434"
    />
    <title>Clipper - the developer's cutting room</title>
    <!-- The first screen's body and heading faces, fetched with the HTML instead of after the CSS. -->
    <link
      rel="preload"
      href="/fonts/public-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
