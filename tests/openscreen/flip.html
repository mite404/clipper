<!doctype html>
<meta charset="utf-8" />
<title>flip</title>
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #00ff00;
    cursor: default;
    user-select: none;
  }
  body.b {
    background: #ff00ff;
  }
  #log {
    position: fixed;
    left: 12px;
    bottom: 12px;
    font:
      28px/1.3 Menlo,
      monospace;
    color: #000;
    background: #fff;
    padding: 6px 10px;
  }
</style>
<pre id="log">click anywhere</pre>
<script>
  const rows = [];
  addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    document.body.classList.toggle('b');
    const down = e.timeStamp;
    requestAnimationFrame(() =>
      requestAnimationFrame((t) => {
        rows.push(`${rows.length + 1}: ${Math.round(t - down)}ms`);
        document.getElementById('log').textContent = rows.join('  ');
      }),
    );
  });
</script>
