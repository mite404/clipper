name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.9.10
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run typecheck
      - name: Check standalone TypeScript diagnostics
        run: npm run typecheck:tsc
      - name: Check ticket identity and review coverage
        run: node scripts/check-tickets.mjs
      # './Timeline' and './timeline' are one file on a case-insensitive disk (macOS, Windows), where
      # imports then resolve to the wrong module. Linux cannot see that, so refuse such names here.
      - name: Refuse file names that differ only by case
        run: |
          clash=$(git ls-files | sed -E 's/\.[^./]+$//' | sort -u | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$clash" ]; then echo "Names differ only by case: $clash"; exit 1; fi
      # A push can carry several commits, so compare with the commit main held before it. HEAD^
      # would let a hotspot and its re-saved baseline through in any commit but the last. No run
      # is cancelled by a later push either: that push would compare against the unchecked one.
      - name: Check code health against the commit before this push
        if: ${{ !cancelled() }}
        env:
          BASELINE_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
        run: npm run check:code -- --fail-on-baseline-growth --baseline-base "$BASELINE_BASE"
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - name: Install browser and media inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run test:ui -- --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
