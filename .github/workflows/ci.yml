name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.9.10
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run typecheck
      - run: npm run check:code -- --fail-on-baseline-growth --baseline-base HEAD^
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - name: Install browser and media inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run test:ui -- --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
