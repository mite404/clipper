name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    # Headroom for the growing UI suite: CLIP-49's agent/transcribe specs took test:ui past 20
    # minutes and the job died on this cap with every check green. Hang guards stay per step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.9.10
      - run: npm ci
      # Whisper files are pinned by revision and SHA-256 in the script, so its hash keys the cache.
      - uses: actions/cache@v6
        with:
          path: public/models
          key: whisper-${{ hashFiles('scripts/fetch-whisper.mjs') }}
      - run: npm run fetch:whisper
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run typecheck
      - name: Check standalone TypeScript diagnostics
        run: npm run typecheck:tsc
      - name: Check ticket identity and review coverage
        run: node scripts/check-tickets.mjs
      # './Timeline' and './timeline' are one file on a case-insensitive disk (macOS, Windows), where
      # imports then resolve to the wrong module. Linux cannot see that, so refuse such names here.
      - name: Refuse file names that differ only by case
        run: |
          clash=$(git ls-files | sed -E 's/\.[^./]+$//' | sort -u | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$clash" ]; then echo "Names differ only by case: $clash"; exit 1; fi
      # A push can carry several commits, so compare with the commit main held before it. HEAD^
      # would let a hotspot and its re-saved baseline through in any commit but the last. No run
      # is cancelled by a later push either: that push would compare against the unchecked one.
      - name: Check code health against the commit before this push
        if: ${{ !cancelled() }}
        env:
          BASELINE_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^' }}
        run: npm run check:code -- --fail-on-baseline-growth --baseline-base "$BASELINE_BASE"
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - name: Install browser and media inspection tools
        # The apt mirror has hung this step for 15 of the job's 20 minutes; it normally takes about
        # 25 seconds. Each command gets a short bound and three attempts, and the step as a whole
        # fails in minutes instead of waiting out the job.
        timeout-minutes: 6
        run: |
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed or timed out: $*"
              sleep 5
            done
            return 1
          }
          # What was still running when the system-dependency install gave up, and who holds the dpkg
          # and apt locks, so a red run says what stalled it. Prints only; the step still fails.
          diagnose() {
            set +e # the step is already failing: report whatever can be read, then exit 1 below
            echo "::group::apt and dpkg state after the last failed attempt"
            ps -ef | grep -E 'apt|dpkg' | grep -v grep || echo "no apt or dpkg process is running"
            locks="/var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock"
            if command -v fuser > /dev/null; then holders=$(sudo fuser -v $locks 2>&1); else holders=$(sudo lsof $locks 2>&1); fi
            echo "lock holders: ${holders:-none reported}"
            sudo tail -n 40 /var/log/apt/term.log || echo "no apt term.log"
            echo "::endgroup::"
          }
          # Anything that runs apt goes through `sudo timeout`: timeout must be root to stop what apt
          # started, and `playwright install --with-deps` would run its apt under a root sudo that an
          # unprivileged timeout cannot stop, so install the system dependencies separately.
          retry sudo env "PATH=$PATH" timeout -k 10 180 npx playwright install-deps chromium ||
            { diagnose; exit 1; }
          retry timeout -k 10 180 npx playwright install chromium
          retry sudo timeout -k 10 90 apt-get update
          retry sudo timeout -k 10 150 apt-get install -y ffmpeg
      - run: npm run test:ui -- --workers=1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
